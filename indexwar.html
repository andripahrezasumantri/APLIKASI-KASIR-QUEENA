<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARKOP WANSONG 97 - Kasir Penjualan</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root {
      /* Nuansa Biru Langit Pekat & Modern */
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --primary-light: #BAE6FD;
      --bg-sky: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
      --success: #22C55E;
      --danger: #EF4444;
      --font-sans: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-sky);
      background-attachment: fixed;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Navbar Glassmorphism */
    .navbar {
      background-color: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--primary-light) !important;
    }

    .navbar-brand { 
      font-weight: 700; 
      color: var(--primary) !important; 
    }

    /* POS Cards */
    .pos-card { 
      border-radius: 12px; 
      border: 1px solid var(--primary-light); 
      background-color: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
    }
    
    .product-grid {
      height: calc(100vh - 220px);
      overflow-y: auto;
    }

    .product-item {
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .product-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    .cart-table-wrapper {
      height: calc(100vh - 460px);
      overflow-y: auto;
    }

    .grand-total-display {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .bg-light-sky {
      background-color: #E0F2FE !important;
      border: 1px solid #7DD3FC;
    }

    .btn-primary {
      background-color: var(--primary);
      border-color: var(--primary);
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .text-primary {
      color: var(--primary) !important;
    }

    .app-footer {
      margin-top: auto;
      background-color: rgba(255, 255, 255, 0.9);
      border-top: 1px solid var(--primary-light);
      padding: 10px 0;
      text-align: center;
    }

    .footer-brand {
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .footer-credit {
      font-size: 0.775rem;
      color: #6B7280;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand bg-white border-bottom px-3 py-2 sticky-top">
    <div class="container-fluid p-0">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-shop text-primary fs-4"></i> WARKOP WANSONG 97
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill fw-medium" id="syncStatus">
          <i class="bi bi-wifi"></i> Online
        </span>
        <div class="vr"></div>
        <div class="text-end lh-1">
          <div class="fw-bold fs-7" id="kasirName">Kasir 1</div>
          <small class="text-muted" id="trxIDDisplay">AVD-TRX-000000</small>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-3">
    <div class="row g-3">
      
      <div class="col-lg-5 col-md-6">
        <div class="card pos-card p-3 mb-3">
          <div class="d-flex gap-2">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
              <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Cari barang / barcode..." onkeyup="filterBarang()">
            </div>
            <button class="btn btn-primary text-nowrap fw-semibold" data-bs-toggle="modal" data-bs-target="#modalTambahBarang">
              <i class="bi bi-plus-lg"></i> Barang
            </button>
          </div>
        </div>

        <div class="product-grid pe-1" id="productGrid">
          <div class="text-center py-5 text-muted" id="loadingProducts">
            <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
            <div>Memuat data barang...</div>
          </div>
        </div>
      </div>

      <div class="col-lg-7 col-md-6">
        <div class="card pos-card p-3">
          
          <h6 class="fw-bold mb-3 text-primary"><i class="bi bi-cart3"></i> Keranjang Belanja</h6>
          <div class="cart-table-wrapper mb-3 border-bottom">
            <table class="table table-hover align-middle mb-0" id="cartTable">
              <thead class="table-light sticky-top">
                <tr>
                  <th>Produk</th>
                  <th width="120">Harga</th>
                  <th width="110" class="text-center">Qty</th>
                  <th width="120" class="text-end">Subtotal</th>
                  <th width="40"></th>
                </tr>
              </thead>
              <tbody id="cartBody">
              </tbody>
            </table>
          </div>

          <div class="row g-3">
            <div class="col-md-6 border-end">
              <div class="mb-2">
                <label class="form-label small text-muted mb-1">Metode Pembayaran</label>
                <select class="form-select" id="payMethod">
                  <option value="Tunai">Tunai</option>
                  <option value="QRIS">QRIS</option>
                  <option value="Transfer">Transfer</option>
                  <option value="Utang">Utang (Piutang)</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label small text-muted mb-1">Diskon Total (Rp)</label>
                <input type="number" id="discountInput" class="form-control" value="0" min="0" oninput="hitungTotal()">
              </div>
              <div>
                <label class="form-label small text-muted mb-1">Uang Diterima (Rp)</label>
                <input type="number" id="cashInput" class="form-control form-control-lg fw-bold" placeholder="0" oninput="hitungTotal()">
              </div>
            </div>

            <div class="col-md-6 d-flex flex-column justify-content-between">
              <div class="bg-light-sky p-3 rounded-3 text-end">
                <small class="text-primary d-block fw-bold">TOTAL BAYAR</small>
                <div class="grand-total-display" id="grandTotalDisplay">Rp 0</div>
                <hr class="my-2" style="border-color: #7DD3FC;">
                <div class="d-flex justify-content-between small">
                  <span class="text-muted">Kembalian:</span>
                  <span class="fw-bold text-success" id="changeDisplay">Rp 0</span>
                </div>
              </div>

              <div class="d-grid gap-2 mt-3">
                <button class="btn btn-success btn-lg fw-bold py-2" id="btnCheckout" onclick="prosesBayar()">
                  <i class="bi bi-check-circle"></i> PROSES BAYAR
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="resetCart()">
                  Batalkan Transaksi
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="modalTambahBarang" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-box-seam me-1 text-primary"></i> Tambah Barang Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formTambahBarang">
            <div class="mb-2">
              <label class="form-label small fw-semibold">Barcode / Scan Kode</label>
              <input type="text" id="inBarcode" class="form-control" placeholder="Contoh: 899999900001" required>
            </div>
            <div class="mb-2">
              <label class="form-label small fw-semibold">Nama Barang</label>
              <input type="text" id="inNamaBarang" class="form-control" placeholder="Contoh: Kopi Hitam Jas" required>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small fw-semibold">Kategori</label>
                <input type="text" id="inKategori" class="form-control" placeholder="Minuman" value="Minuman">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Satuan</label>
                <input type="text" id="inSatuan" class="form-control" placeholder="Cangkir/Pcs" value="Cangkir" required>
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small fw-semibold">Harga Modal (Rp)</label>
                <input type="number" id="inHargaModal" class="form-control" placeholder="0" min="0" required>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Harga Jual (Rp)</label>
                <input type="number" id="inHargaJual" class="form-control" placeholder="0" min="0" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Stok Awal</label>
                <input type="number" id="inStok" class="form-control" placeholder="0" min="0" value="10" required>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Expired (Opsional)</label>
                <input type="date" id="inExpired" class="form-control">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary fw-semibold" onclick="simpanBarangBaru()">Simpan Barang</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="container-fluid">
      <div class="footer-brand mb-1">
        WARKOP WANSONG 97 POS &copy; 2026
      </div>
      <div class="footer-credit">
        Built with Precision by <strong>Andri Pahreza S.</strong> (APS Design System)
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
